{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ if .Description }}
  <p style="font-size: 1.15rem; color: var(--text-secondary); margin-bottom: 2rem;">{{ .Description }}</p>
{{ end }}

<div class="content-body">
  {{ .Content }}

  <div style="margin-top: 2rem;">
    {{ range .Pages }}
      <div style="margin-bottom: 1.5rem; padding: 1.25rem; border: 1px solid var(--border-color); border-radius: 0.5rem; background: var(--bg-card);">
        <h3 style="margin: 0 0 0.5rem 0;"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        {{ if .Description }}
          <p style="margin: 0; font-size: 0.95rem; color: var(--text-secondary);">{{ .Description }}</p>
        {{ end }}
      </div>
    {{ end }}
  </div>
</div>
{{ end }}
